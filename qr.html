<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win Kids Parent Guide QR Codes</title>
<meta name="robots" content="noindex">
<script src="/qrcode.js"></script>
<style>
  body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; color: #15233b; background: #fff; }
  .bar { padding: 16px; background: #e3ecfc; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .bar button { font: 700 16px inherit; padding: 10px 18px; border: 0; border-radius: 999px; background: #1f5fd6; color: #fff; cursor: pointer; }
  .sheet { max-width: 8in; margin: 0 auto; padding: 0.4in 0.3in; }
  h1 { text-align: center; margin: 0 0 4px; font-size: 26px; }
  .sub { text-align: center; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px 20px; }
  .code { display: flex; flex-direction: column; align-items: center; gap: 8px; break-inside: avoid; }
  .code svg { width: 2.1in; height: 2.1in; }
  .label { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .url { font-size: 11px; color: #56647c; word-break: break-all; text-align: center; }
  footer { text-align: center; font-size: 12px; margin-top: 28px; color: #56647c; }
  @media print { .bar { display: none; } .sheet { padding: 0; } }
</style>
</head>
<body>
<div class="bar">
  <span>These codes point to <b id="origin"></b>. Print this page and cut out the codes for each class area.</span>
  <button onclick="window.print()">Print QR sheet</button>
</div>
<div class="sheet">
  <h1>Win Kids Gymnastics · Parent Guide</h1>
  <p class="sub">Scan to see what your child is working on, in plain language.</p>
  <div class="grid" id="grid"></div>
  <footer>Win Kids Sports &amp; Learning Center · 3000 Waketon Rd, Flower Mound, TX · 972-355-9988</footer>
</div>
<script>
  const base = location.origin + "/";
  document.getElementById("origin").textContent = base;
  const items = [
    ["Parent Guide (all classes)", "", null],
    ["Preschool", "#preschool", "#9aa6ba"],
    ["Gym Girls · Pink leo", "#gym-girls", "#e8579a"],
    ["Cartwheels · Blue leo", "#cartwheels", "#2f7de1"],
    ["Dynamos · Red leo", "#dynamos", "#d93a3a"],
    ["Spirals · Black leo", "#spirals", "#1b1b1f"]
  ];
  document.getElementById("grid").innerHTML = items.map(([label, hash, color]) => {
    const q = qrcode(0, "M"); q.addData(base + hash); q.make();
    return `<div class="code">${q.createSvgTag({ scalable: true, margin: 2 })}
      <div class="label">${color ? `<span class="dot" style="background:${color}"></span>` : ""}${label}</div>
      <div class="url">${base + hash}</div></div>`;
  }).join("");
</script>
</body>
</html>
